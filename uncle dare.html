<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>uncle dare</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 30px;
                background: rgb(232, 216, 216);
            }

            img {
                width: 120px;
                height: 120px;
                border-radius: 50%;
                float: left;
                margin-right: 16px;
            }

            .username {
                font-weight: bold;
                margin: 10px;
            }
        </style>
    </head>
    <img src="images/pexels-navidsohrabi-16682442.jpg" alt="Uncle Dare" />
    <p class="username">@uncle dare</p>
    <p>i love to build websites;</p>
    <button>suscribe</button>
    <style>
        button {
            background-color: red;
            color: black;
            transition: all 0.3s ease;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            padding: 10px 16px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            background-color: black;
            color: white;
        }
    </style>

    <video width="320" height="240" controls>
        <source src="video.mp4" type="video/mp4" />
        <source src="images/video.mp4" type="video/ogg" />
        Your browser does not support the video tag.
    </video>
    <h2>basic navbar</h2>
    <ul>
        <li><a href="home">home</a></li>
        <li><a href="info">info</a></li>
        <li><a href="contact">contact</a></li>
        <li><a href="address">address</a></li>
    </ul>

    <style>
        ul {
            list-style-type: none;
            margin: 10px 0;
            padding: 0;
            background-color: black;
            display: flex;
            width: fit-content;
        }

        li a {
            display: block;
            color: white;
            padding: 12px 18px;
            text-decoration: none;
        }

        li a:hover {
            background-color: white;
            color: black;
        }
        .container {
            display: flex;
            background-color: red;
        }
        .container div {
            padding: 20px;
            background-color: black;
            margin: 15px;
            font-size: 20px;
            color: white;
            cursor: pointer;
        }
    </style>

    <body>
        <div class="container">
            <div>home</div>
            <div>info</div>
            <div>contact</div>
            <div>address</div>
        </div>
    </body>
</html>
